[package]
name = "rustycrone"
version = "0.1.0"
description = "A friendly cron manager for macOS and Linux"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
